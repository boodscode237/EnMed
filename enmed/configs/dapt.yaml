# Stage 02 — domain-adaptive continual pre-training.
defaults: base.yaml
output_name: EnMed-DAPT
lora:
  r: 64
  alpha: 64
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  per_device_train_batch_size: 6
  gradient_accumulation_steps: 6
  num_train_epochs: 1
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  weight_decay: 0.001
  lr_scheduler_type: cosine
  optim: adamw_8bit
  logging_steps: 1
  save_steps: 200
  save_total_limit: 1
